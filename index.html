<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11182e">
  <meta name="description" content="表示済みページからデュエル・マスターズのカード情報を安全に回収">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles.css">
  <title>DM Card Collector</title>
</head>
<body>
  <header><div><span class="eyebrow">LOCAL-FIRST PWA</span><h1>DM Card<br><b>Collector</b></h1></div><button id="install" class="ghost" hidden>インストール</button></header>
  <main>
    <section class="hero"><p>表示済みのページから、カード情報と画像URL候補だけを端末内へ。</p><div class="stats"><article><strong id="staging-count">0</strong><span>STAGING</span></article><article><strong id="raw-count">0</strong><span>RAW</span></article><article><strong id="failed-count">0</strong><span>FAILED</span></article></div></section>
    <section class="panel">
      <label for="mht-input">公式カード検索 MHT / MHTML</label>
      <div id="mht-drop" class="drop-zone"><input id="mht-input" type="file" accept=".mht,.mhtml,multipart/related,message/rfc822"><strong>MHT/MHTMLを追加</strong><small>端末内だけで解析・保存します（最大50 MB）</small></div>
      <div id="mht-result" class="import-result" aria-live="polite"></div>
    </section>
    <section class="panel">
      <label for="capture-input">テキスト / URL / JSON</label>
      <textarea id="capture-input" rows="7" placeholder="カード名、型番、能力テキスト、URLなどを貼り付け"></textarea>
      <div class="actions"><button id="capture">回収して検証</button><button id="capture-page" class="secondary">このページの表示DOM</button></div>
      <p id="status" role="status">データはこの端末だけに保存されます。</p>
    </section>
    <section class="panel toolbar"><div><h2>回収キュー</h2><small>重複排除・中断後も再開可能</small></div><div><button id="resume" class="ghost">再検証</button><button id="export" class="ghost">JSON出力</button></div></section>
    <section id="records" class="records" aria-live="polite"></section>
  </main>
  <footer>NO CLOUD WRITES · INDEXEDDB ONLY</footer>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
