name: Cloudflare Preview

on:
  pull_request:
    branches: [main]

# Minimum permissions — no write to contents or pages
permissions:
  contents: read
  pull-requests: write    # to post the preview URL comment
  deployments: write      # required by cloudflare/wrangler-action

concurrency:
  group: cf-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Run tests before deploying (fail fast)
      - name: Tests
        run: npm test

      - name: Syntax checks
        run: |
          node --check src/app.js
          node --check src/core.js
          node --check src/db.js
          node --check src/mht.js
          node --check src/mht-pipeline.js
          node --check src/status.js
          node --check sw.js

      # Build isolated dist/ — only PWA delivery assets, no node_modules
      - name: Build preview dist
        run: npm run build:preview

      # Verify dist is clean
      - name: Verify dist contents
        run: |
          echo "=== dist contents ==="
          find dist -type f | sort
          echo "=== checking blocked paths ==="
          if find dist -name "node_modules" | grep -q .; then echo "ERROR: node_modules in dist"; exit 1; fi
          if find dist -name ".git" | grep -q .; then echo "ERROR: .git in dist"; exit 1; fi
          if find dist -name "*.mht" -o -name "*.mhtml" | grep -q .; then echo "ERROR: MHT files in dist"; exit 1; fi
          echo "dist clean OK"

      # Deploy to Cloudflare Workers as a preview (non-production branch).
      # Deploys to dm-card-collector.workers.dev — isolated from production GitHub Pages.
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repo secrets.
      - name: Deploy to Cloudflare (preview)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          WRANGLER_LOG: info

      - name: Post preview URL comment
        if: steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🚀 Cloudflare Preview\n\n**GALAXY ACCEPTANCE URL:** ${url}\n\n> Preview-only. Not merged to main. Not production Pages.`
            });
